server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # Eureka server should not register itself as a client
    register-with-eureka: false
    # Eureka server does not need to fetch registry from itself
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Don't wait for other eureka nodes on startup (we have only one)
    wait-time-in-ms-when-sync-empty: 0
    # Disable self-preservation mode in development
    # (in prod set this to true to avoid mass de-registration on network issues)
    enable-self-preservation: false

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
